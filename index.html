<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#215f4b"><title>Bangtao 7 Week Prep</title><style>
:root{--bg:#f5f5f1;--card:#fff;--text:#171717;--muted:#6b6b66;--border:#deded7;--accent:#215f4b;--soft:#e7f1ed;--warn:#fff4df;--danger:#f9e8e8}*{box-sizing:border-box;min-width:0}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.wrap{max-width:760px;margin:auto;padding:10px}h1{font-size:26px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}.muted,.micro{font-size:13px;color:var(--muted);line-height:1.4}.micro{font-size:11px}.card,.exercise-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;margin:12px 0;overflow:hidden}.exercise-card{background:#fafaf7;border-radius:14px;margin:10px 0}.row,.workout-head,.complete{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between,.workout-head,.complete{justify-content:space-between}.pill{background:var(--soft);color:var(--accent);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.warning{background:var(--warn);border:1px solid #ecd6ad;border-radius:12px;padding:11px;font-size:13px;color:#6f4b18}.danger{background:var(--danger);color:#762f2f}button,input,select,textarea{font:inherit;max-width:100%}button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 12px;font-weight:750}button.secondary{background:#ecece7;color:#222}input[type=number],select,textarea{border:1px solid var(--border);border-radius:9px;padding:8px;background:#fff}textarea{width:100%;min-height:78px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffffff7;border-top:1px solid var(--border);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;background:transparent;color:var(--muted);border-radius:0;padding:11px 2px;font-size:11px}.tabs button.active{color:var(--accent)}section{display:none}section.active{display:block}.exercise-title{font-weight:800}.exercise-meta{font-size:12px;color:var(--muted);margin-top:3px}.tag{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:4px 7px;color:var(--muted)}.video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:#000;margin-top:10px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.setrow{display:grid;grid-template-columns:38px minmax(52px,1fr) minmax(52px,1fr) 30px;gap:5px;align-items:center;margin-top:8px}.setrow.three{grid-template-columns:38px minmax(60px,1fr) 30px}.setrow input{width:100%}.setrow input[type=checkbox],.complete input{width:26px;height:26px}.sidehead{font-size:12px;font-weight:800;color:var(--muted);margin-top:12px}.timerbtn{width:100%;display:flex;justify-content:space-between;background:#fff;color:var(--text);border:1px solid var(--border);margin-top:8px}.timerbtn.running{border-color:var(--accent);background:var(--soft)}.count{font-variant-numeric:tabular-nums;font-weight:800}.complete{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.bikegrid{display:grid;gap:8px}.bikegrid label{display:grid;grid-template-columns:1fr 82px;align-items:center;gap:8px}.bikeTimer{width:100%;font-size:18px}.slot,.day{padding:10px 0;border-top:1px solid var(--border)}.slot{display:flex;justify-content:space-between}.slot input{width:24px;height:24px}.metric{flex:1;min-width:90px;border:1px solid var(--border);border-radius:12px;padding:10px}.big{font-size:22px;font-weight:800}
</style></head><body><div class="wrap">
<section id="today" class="active"><div class="row between"><div><h1>Bangtao Prep</h1><div id="dateText" class="muted"></div></div><span id="weekPill" class="pill"></span></div><div class="card"><h2>Morning foot check</h2><div class="row"><label>Pain <input id="pain" type="number" min="0" max="10" value="0" style="width:58px"> / 10</label><select id="trend"><option>Better</option><option selected>Same</option><option>Worse</option></select></div><div id="loadMessage" class="warning" style="margin-top:12px"></div></div><div class="card"><h2>Today's full workout</h2><div id="todayPlan"></div></div><div class="card"><h2>Daily plantar rehab</h2><div id="rehabPlan"></div></div><div class="card"><h2>Notes</h2><textarea id="notes"></textarea><button onclick="saveToday()" style="width:100%;margin-top:10px">Save today</button></div></section>
<section id="week"><h1>Week setup</h1><div class="card"><div class="row"><select id="weekSelect" onchange="setWeek(this.value)"></select><span id="phasePill" class="pill"></span></div><p id="weekFocus" class="muted"></p></div><div class="card"><h2>Kickboxing this week</h2><div id="kbSlots"></div><button onclick="saveSlots()" style="width:100%">Update week</button></div><div class="card"><h2>7 day overview</h2><div id="weekPlan"></div></div></section>
<section id="library"><h1>Exercise library</h1><div id="exerciseLibrary"></div></section><section id="progress"><h1>Progress</h1><div class="card"><div class="row"><div class="metric">Logged days<div id="loggedDays" class="big">0</div></div><div class="metric">Avg pain<div id="avgPain" class="big">0</div></div></div></div><div class="card"><div id="history"></div></div></section></div><div class="tabs"><button id="tabToday" class="active" onclick="showTab('today')">Today</button><button id="tabWeek" onclick="showTab('week')">Week</button><button id="tabLibrary" onclick="showTab('library')">Exercises</button><button id="tabProgress" onclick="showTab('progress')">Progress</button></div><script>
const $=id=>document.getElementById(id);const phases={1:['Foundation',30,3],2:['Foundation',35,3],3:['Build',40,4],4:['Build',45,4],5:['Specific',50,5],6:['Specific',55,6],7:['Taper',30,3]};const slots=[['mon',1,'Monday evening'],['tue',2,'Tuesday noon'],['wed',3,'Wednesday evening'],['thu',4,'Thursday noon'],['fri',5,'Friday evening']];
const EX={rdl:['Romanian deadlift',3,12,'strength','Hinge back. Soft knees. Neutral spine.','3VXmecChYYM'],split:['Rear foot elevated split squat',3,12,'strength-side','Controlled depth.','bwhl_9jN_3o'],seatedcalf:['Seated calf raise',3,12,'rehab-side-reps','Pause at top. Lower slowly.','JbyjNymZOt0'],tib:['Tibialis raise',3,12,'strength','Keep heels down.','boFuKPm5w2Q'],row:['1 arm cable row',3,12,'strength-side','Keep ribs stacked.','UCXxvVItLoM'],pallof:['Pallof press',3,12,'strength-side','Resist rotation.','AH_QZLm_0-s'],step:['Step up',3,12,'strength-side','Drive through working leg.','URHdW9js6DM'],slrdl:['Single leg RDL',3,12,'strength-side','Keep hips square.','Zfr6wizR8rs'],standingcalf:['Slow standing calf raise',3,12,'rehab-side-reps','Use support and lower slowly.','gwLzBJYoWlI'],copenhagen:['Copenhagen plank',3,30,'timed-side','Keep hips stacked.','gsWpUFyVRyM'],push:['Pushup or dumbbell press',3,12,'strength','Stay controlled.','IODxDxX7oi4'],carry:['Suitcase carry',3,30,'timed-side','Walk tall.','4S7tW2QdCkQ'],plantar:['Plantar fascia stretch',3,30,'timed-foot','Gently pull toes toward shin.','R7MSJ0qQy8A'],straightstretch:['Straight knee calf stretch',3,30,'timed-foot','Heel down, knee straight.','iIQx2Cx2NoQ'],bentstretch:['Bent knee calf stretch',3,30,'timed-foot','Heel down, knee bent.','iIQx2Cx2NoQ'],shortfoot:['Short foot / arch control',2,12,'rehab-foot-reps','Shorten arch without curling toes.','DoEIW4Y8MEo'],shadow:['Shadowboxing',3,180,'timed','Relaxed technical rounds.','4fwN8uiF7z8']};const rehab=['plantar','straightstretch','bentstretch','standingcalf','seatedcalf','shortfoot'];
function store(){return JSON.parse(localStorage.getItem('bangtao7')||'{"week":1,"slots":["mon","wed","fri"],"days":[]}')}function put(s){localStorage.setItem('bangtao7',JSON.stringify(s))}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
let audioCtx;function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,dur=.06,vol=.045,type='sine'){let c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}function tick(){tone(900,.035,.025,'square')}function ding(){tone(880,.16,.07);setTimeout(()=>tone(1320,.3,.06),120)}
let timers={};function startCountdown(id,seconds,done){audio();if(timers[id]){clearInterval(timers[id]);delete timers[id];return}let el=$(id),remain=seconds+3;el.classList.add('running');el.querySelector('.count').textContent='Get ready 3';timers[id]=setInterval(()=>{remain--;if(remain>seconds){el.querySelector('.count').textContent=`Get ready ${remain-seconds}`;tick()}else{el.querySelector('.count').textContent=fmt(remain);if(remain<=3&&remain>0)tick()}if(remain<=0){clearInterval(timers[id]);delete timers[id];el.classList.remove('running');el.querySelector('.count').textContent='Done';$(done).checked=true;ding();if(navigator.vibrate)navigator.vibrate([120,80,120])}},1000)}
function timerRows(k,label,side){let e=EX[k],h=label?`<div class="sidehead">${label}</div>`:'';for(let i=1;i<=e[1];i++){let id=`t_${k}_${side}_${i}`,done=`${k}_${side}_done_${i}`;h+=`<button class="timerbtn" id="${id}" onclick="startCountdown('${id}',${e[2]},'${done}')"><span>Set ${i}</span><span class="count">${fmt(e[2])}</span></button><div class="complete"><span class="micro">3 sec setup. Ticks at the end, then ding.</span><input id="${done}" type="checkbox"></div>`}return h}function reps(k,label,side,wt){let e=EX[k],h=label?`<div class="sidehead">${label}</div>`:'';for(let i=1;i<=e[1];i++)h+=`<div class="setrow ${wt?'':'three'}"><b>Set ${i}</b><input id="${k}_${side}_reps_${i}" type="number" value="${e[2]}">${wt?`<input id="${k}_${side}_wt_${i}" type="number" placeholder="lb">`:''}<input id="${k}_${side}_done_${i}" type="checkbox"></div>`;return h}function track(k){let m=EX[k][3];if(m==='strength')return reps(k,'','both',1);if(m==='strength-side')return reps(k,'Left','left',1)+reps(k,'Right','right',1);if(m==='rehab-side-reps')return reps(k,'Left leg','left',0)+reps(k,'Right leg','right',0);if(m==='rehab-foot-reps')return reps(k,'Left foot','left',0)+reps(k,'Right foot','right',0);if(m==='timed-foot')return timerRows(k,'Left foot','left')+timerRows(k,'Right foot','right');if(m==='timed-side')return timerRows(k,'Left side','left')+timerRows(k,'Right side','right');return timerRows(k,'','both')}
function card(k,tracking=1){let e=EX[k];return `<div class="exercise-card"><div class="exercise-title">${e[0]}</div><div class="exercise-meta">${e[1]} sets · ${e[3].startsWith('timed')?fmt(e[2]):e[2]+' reps'}</div><div class="muted">${e[4]}</div>${tracking?track(k):''}<details><summary>Show tutorial</summary><div class="video"><iframe src="https://www.youtube.com/embed/${e[5]}" allowfullscreen></iframe></div></details></div>`}
function selected(){return store().slots||['mon','wed','fri']}function kb(d){return slots.some(x=>selected().includes(x[0])&&x[1]===d)}function plan(d,w){let p=phases[w],out=[];if(kb(d))out.push(['kb','Kickboxing class','Technique']);if(d===1&&!kb(d)||d===2&&!kb(d))out.push(['strength','Strength A','35 to 45 min']);if(d===3&&!kb(d)||d===6)out.push(['bike','Bike',p[1]]);if(d===4&&!kb(d))out.push(['strengthB','Strength B','30 to 40 min']);if(d===5&&!kb(d))out.push(['shadow','Shadowboxing',p[2]]);if(d===0&&w<=5)out.push(['bike','Optional easy bike',Math.max(20,p[1]-10)]);if(!out.length)out.push(['recovery','Recovery + plantar rehab','Easy']);return out}
let bikeTimers={};function startBike(id,mins,done){audio();if(bikeTimers[id]){clearInterval(bikeTimers[id]);delete bikeTimers[id];return}let r=mins*60+3,b=$(id);b.textContent='Get ready 3';bikeTimers[id]=setInterval(()=>{r--;if(r>mins*60){b.textContent=`Get ready ${r-mins*60}`;tick()}else{b.textContent=fmt(r);if(r<=3&&r>0)tick()}if(r<=0){clearInterval(bikeTimers[id]);delete bikeTimers[id];b.textContent='Done';$(`${id}_actual`).value=mins;$(done).checked=true;ding()}},1000)}function bikeCard(title,mins,i){let id=`bike_${i}`,done=`${id}_done`;return `<div class="exercise-card"><div class="workout-head"><div><div class="exercise-title">${title}</div><div class="muted">Any stationary bike. Steady pace.</div></div><span class="tag">${mins} min</span></div><div class="bikegrid"><label>Actual minutes <input id="${id}_actual" type="number" placeholder="0"></label><button class="secondary bikeTimer" id="${id}" onclick="startBike('${id}',${mins},'${done}')">Start ${mins}:00 countdown</button><div class="complete"><span>Completed</span><input id="${done}" type="checkbox"></div></div></div>`}
function renderToday(){let s=store(),w=s.week||1,d=new Date().getDay(),pain=+$('pain').value||0,blocks=plan(d,w);if(pain>=5)blocks=blocks.filter(x=>!['strength','strengthB','shadow'].includes(x[0]));let h='';blocks.forEach((b,i)=>{if(b[0]==='bike')h+=bikeCard(b[1],b[2],i);else if(b[0]==='strength')h+=['rdl','split','seatedcalf','tib','row','pallof'].map(card).join('');else if(b[0]==='strengthB')h+=['step','slrdl','standingcalf','copenhagen','push','carry'].map(card).join('');else if(b[0]==='shadow')h+=card('shadow');else h+=`<div class="exercise-card"><div class="exercise-title">${b[1]}</div><div class="complete"><span>Completed</span><input id="session_${i}_done" type="checkbox"></div></div>`});$('todayPlan').innerHTML=h;$('loadMessage').textContent=pain>=5?'High symptom day. Keep impact low and use easy cycling and rehab only.':'Proceed with the low impact progression. Avoid extra running or jump rope while the foot is irritated.'}
function renderRehab(){$('rehabPlan').innerHTML=rehab.map(k=>card(k)).join('')}function renderWeek(){let s=store(),w=s.week||1,p=phases[w];$('weekPill').textContent=`Week ${w} of 7`;$('phasePill').textContent=p[0];$('weekFocus').textContent=`Bike target ${p[1]} min. Shadowboxing ${p[2]} rounds.`;$('weekSelect').value=w;$('kbSlots').innerHTML=slots.map(x=>`<div class="slot"><b>${x[2]}</b><input id="slot_${x[0]}" type="checkbox" ${selected().includes(x[0])?'checked':''}></div>`).join('');let h='';for(let d=1;d<=7;d++){let j=d===7?0:d;h+=`<div class="day"><b>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][j]}</b>${plan(j,w).map(x=>`<div class="muted">${x[1]} · ${x[2]}</div>`).join('')}</div>`}$('weekPlan').innerHTML=h}function saveSlots(){let s=store();s.slots=slots.filter(x=>$(`slot_${x[0]}`).checked).map(x=>x[0]);put(s);renderWeek();renderToday()}function setWeek(w){let s=store();s.week=+w;put(s);renderWeek();renderToday()}
function saveToday(){let s=store(),days=(s.days||[]).filter(x=>x.date!==new Date().toISOString().slice(0,10)),fields={};document.querySelectorAll('#today input').forEach(e=>fields[e.id]=e.type==='checkbox'?e.checked:e.value);days.push({date:new Date().toISOString().slice(0,10),pain:+$('pain').value||0,fields,notes:$('notes').value});s.days=days;put(s);alert('Saved on this device.')}function progress(){let d=store().days||[];$('loggedDays').textContent=d.length;$('avgPain').textContent=(d.length?d.reduce((a,x)=>a+x.pain,0)/d.length:0).toFixed(1);$('history').innerHTML=d.slice().reverse().slice(0,14).map(x=>`<div class="day"><b>${x.date}</b> · pain ${x.pain}/10</div>`).join('')}
function showTab(n){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));$(n).classList.add('active');$('tab'+n[0].toUpperCase()+n.slice(1)).classList.add('active');if(n==='progress')progress()}$('weekSelect').innerHTML=[1,2,3,4,5,6,7].map(x=>`<option value="${x}">Week ${x}</option>`).join('');$('dateText').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('pain').oninput=renderToday;$('trend').onchange=renderToday;renderRehab();renderWeek();renderToday();$('exerciseLibrary').innerHTML=Object.keys(EX).map(k=>card(k,0)).join('');
</script></body></html>
